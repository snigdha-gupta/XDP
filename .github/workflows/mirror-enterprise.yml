name: Mirror main to GitHub Enterprise XDP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-xdp-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: [ self-hosted, Ubuntu-22.04 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to enterprise
        env:
          ENTERPRISE_TOKEN: ${{ secrets.XDP_ENTERPRISE_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$ENTERPRISE_TOKEN" | base64 -w0)
          hdr="http.extraHeader=AUTHORIZATION: basic ${auth}"

          git -c "$hdr" clone https://gitenterprise.xilinx.com/XDP/XDP.git "$RUNNER_TEMP/XDP"
          cd "$RUNNER_TEMP/XDP"
          git pull --no-rebase https://github.com/snigdha-gupta/XDP.git main
          git -c "$hdr" push origin automated_testing

